[package]
name = "crate-host"
description = "Host services the engine uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["slirp"]
# User-mode networking through libslirp (BSD-3-Clause), linked dynamically from
# the system (Homebrew's on a Mac). libslirp itself depends on GLib
# (LGPL-2.1-or-later), which is why it stays a separate dynamic library.
slirp = []

[dependencies]
crate-core.workspace = true
libc.workspace = true

[lints]
workspace = true
