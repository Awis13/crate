[workspace]
resolver = "3"
members = ["crates/*", "tools/crate-run"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/oneamendez/crate"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
